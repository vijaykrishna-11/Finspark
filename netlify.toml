# FinSpark Netlify Configuration
# Static site deployment - no build required

[build]
  # Publish the root directory as-is
  publish = "."
  # No build command needed for static site
  command = ""

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS and JS for 1 week
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JSON files (locales) - cache for 1 hour
[[headers]]
  for = "/locales/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=utf-8"

# Redirects (optional - for SPA-like behavior if needed)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200